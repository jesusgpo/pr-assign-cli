[project]
name = "pr-assigner"
version = "0.1.0"
description = "Asigna reviewers a PRs de GitHub balanceando la carga de revisiones"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
    "anyio>=4.3",
]

[project.scripts]
pr-assigner = "pr_assigner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-mock>=3.14",
]

[tool.hatch.build.targets.wheel]
packages = ["pr_assigner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
